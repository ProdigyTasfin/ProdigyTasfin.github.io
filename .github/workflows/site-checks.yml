name: Site checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check links, SEO metadata and JavaScript syntax
        run: python .github/scripts/check_site.py
      - name: Install HTML validation tooling
        run: npm install --prefix "$RUNNER_TEMP/html-validation" --no-audit --no-fund html-validate@10.17.0
      - name: Check structural HTML
        run: HTML_VALIDATE_MODULE="$RUNNER_TEMP/html-validation/node_modules/html-validate" node .github/scripts/check_html.cjs
      - name: Check acquisition catalog, content and responsive assets
        run: |
          python .github/scripts/sync_products.py --check
          python .github/scripts/check_products.py
          python .github/scripts/sync_acquisition.py --check
          python .github/scripts/optimize_images.py --check
          python .github/scripts/check_acquisition.py
      - name: Install browser test dependency
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Check responsive layouts and interactions
        run: python .github/scripts/check_ui.py
      - name: Check themes, discovery and reading tools
        run: python .github/scripts/check_premium.py
      - name: Check acquisition funnel, redirects and privacy boundaries
        run: python .github/scripts/check_acquisition_ui.py
      - name: Check Salvera discovery, policies and original assets
        run: python .github/scripts/check_salvera_ui.py
